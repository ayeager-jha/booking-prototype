  :host {
    display: none;
  }

  /*
   * Window manager host uses pointer-events: none; children must opt back in
   * (same pattern as .app-screen / .modal-backdrop) or clicks pass through.
   */
  :host([open]) {
    display: block;
    position: fixed;
    inset: 0;
    z-index: 1300;
    pointer-events: auto;
  }

  .book-backdrop {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: stretch;
    justify-content: stretch;
    padding: 0;
    overflow: hidden;
    background: var(--jh-color-container-page, #fff);
    pointer-events: auto;
  }

  /* Confirm / booking-error stay compact centered dialogs on a dimmed scrim. */
  .book-backdrop--result {
    align-items: flex-start;
    align-content: flex-start;
    justify-content: center;
    padding: 48px 1rem;
    overflow: auto;
    background: rgba(26, 26, 26, 0.55);
  }

  .book-modal {
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    max-height: 100%;
    flex: 1 1 auto;
    margin: 0;
    border-radius: 0;
    background: var(--jh-color-container-page, #fff);
    color: var(--jh-color-content-primary-enabled, #1a1a1a);
    font-family: var(--jh-font-family-primary, var(--jha-platform-font, 'Figtree', Helvetica, Arial, sans-serif));
    box-shadow: none;
    pointer-events: auto;
    overflow: hidden;
  }

  .book-modal--result {
    width: min(32rem, 100%);
    height: fit-content;
    max-height: calc(100vh - 96px);
    flex: 0 0 auto;
    align-self: flex-start;
    margin: 0 auto;
    border-radius: var(--jh-border-radius-200, 8px);
    box-shadow: var(--jh-shadow-high, 0 0 0 1px var(--jh-color-divider-primary, #e7e7e7), 0 24px 64px rgba(0, 0, 0, 0.28));
    overflow: auto;
  }

  .book-head {
    flex: 0 0 auto;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--jh-color-divider-primary, #e7e7e7);
  }

  .book-step-chrome {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    padding: 1rem 1.5rem 1.1rem;
    border-bottom: 1px solid var(--jh-color-divider-primary, #e7e7e7);
    background: var(--jh-color-container-page, #fff);
  }

  .book-step-back {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    margin: 0;
    padding: 0.15rem 0;
    border: none;
    background: transparent;
    color: var(--jh-color-content-brand-enabled, #0a6ebd);
    font: inherit;
    font-size: 0.875rem;
    font-weight: 600;
    cursor: pointer;
    width: fit-content;
  }

  .book-step-back:hover {
    text-decoration: underline;
  }

  .book-step-back jh-icon-arrow-left {
    --jh-icon-color-fill: currentColor;
  }

  .book-step-identity {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
    min-width: 0;
  }

  .book-step-identity .book-title {
    margin: 0;
  }

  .book-step-meta {
    margin: 0;
    font-size: 0.875rem;
    line-height: 1.4;
    color: var(--jh-color-content-secondary-enabled, #5f5f5f);
  }

  .book-title {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 600;
    line-height: 1.3;
  }

  .book-sub {
    margin: 0.35rem 0 0;
    font-size: 0.875rem;
    line-height: 1.45;
    color: var(--jh-color-content-secondary-enabled, #5f5f5f);
  }

  .book-body {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 1rem 1.5rem 0;
    gap: 0.85rem;
    overflow: hidden;
  }

  .book-error-summary {
    flex: 0 0 auto;
    display: block;
    width: 100%;
  }

  /* Soft alert: tinted / bordered — filled red is reserved for save/booking failures. */
  .book-error-summary jh-notification {
    width: 100%;
    box-sizing: border-box;
    --jh-notification-color-background-neutral: var(
      --jh-color-container-negative-subtle-enabled,
      #fef3f2
    );
    --jh-notification-color-text-neutral: var(--jh-color-content-primary-enabled, #1a1a1a);
    --jh-notification-icon-color-fill-neutral: var(
      --jh-color-content-negative-enabled,
      #b42318
    );
    --jh-notification-action-label-color-text-enabled: var(
      --jh-color-content-brand-enabled,
      #0a6ebd
    );
    --jh-notification-action-label-color-text-hover: var(
      --jh-color-content-brand-hover,
      #085a9e
    );
    --jh-notification-action-label-color-text-focus: var(
      --jh-color-content-brand-hover,
      #085a9e
    );
    --jh-notification-action-label-color-text-active: var(
      --jh-color-content-brand-active,
      #064a85
    );
    border: 1px solid var(--jh-color-border-negative-enabled, #f3b4ae);
    border-radius: var(--jh-border-radius-100, 4px);
  }

  .book-error-summary__body {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.35rem 0.75rem;
    min-width: 0;
    width: 100%;
    word-break: normal;
    overflow-wrap: anywhere;
  }

  .book-error-summary__title {
    margin: 0;
    font-weight: 600;
    line-height: 1.35;
  }

  .book-main {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(14rem, 18rem) minmax(0, 1fr);
    margin: 0 -1.5rem;
    border-top: 1px solid var(--jh-color-divider-primary, #e7e7e7);
  }

  .book-rail {
    box-sizing: border-box;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 0.75rem 0.65rem 0;
    border-right: 1px solid var(--jh-color-divider-primary, #e7e7e7);
    background: var(--jh-color-container-secondary-enabled, #f4f5f6);
  }

  .book-rail__list {
    margin: 0;
    padding: 0 0 1rem;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
  }

  .book-rail__btn {
    box-sizing: border-box;
    display: flex;
    width: 100%;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.5rem;
    margin: 0;
    padding: 0.55rem 0.65rem;
    border: none;
    border-radius: var(--jh-border-radius-100, 4px);
    background: transparent;
    color: var(--jh-color-content-primary-enabled, #1a1a1a);
    font: inherit;
    font-size: 0.875rem;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
  }

  .book-rail__btn:hover {
    background: rgba(0, 0, 0, 0.05);
  }

  /* Match tools sidenav: brand-subtle fill + left accent (not white card). */
  .book-rail__btn.is-active {
    background: var(--jh-color-container-brand-subtle-enabled, #e8f1f8);
    color: var(--jh-color-content-brand-enabled, #0a6ebd);
    font-weight: 600;
    box-shadow: inset 3px 0 0 var(--jh-color-content-brand-enabled, #0a6ebd);
  }

  .book-rail__btn.is-active:hover {
    background: var(--jh-color-container-brand-subtle-hover, #dceaf5);
  }

  .book-rail__text {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.15rem;
  }

  .book-rail__label {
    min-width: 0;
    max-width: 100%;
    overflow-wrap: anywhere;
    line-height: 1.25;
  }

  .book-rail__count {
    font-size: 0.6875rem;
    font-weight: 500;
    color: var(--jh-color-content-secondary-enabled, #5f5f5f);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }

  .book-rail__status {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: flex-end;
    gap: 0.3rem;
    min-height: var(--jh-dimension-600, 1.5rem);
    color: var(--jh-color-content-secondary-enabled, #5f5f5f);
    --jh-icon-color-fill: currentColor;
  }

  .book-rail__status-label {
    font-size: 0.6875rem;
    font-weight: 600;
    line-height: 1.2;
    white-space: nowrap;
  }

  .book-rail__btn.is-error .book-rail__count {
    color: var(--jh-color-content-negative-enabled, #b42318);
  }

  .book-rail__btn.is-error .book-rail__status {
    color: var(--jh-color-content-negative-enabled, #b42318);
    --jh-icon-color-fill: var(--jh-color-content-negative-enabled, #b42318);
  }

  .book-rail__btn.is-complete .book-rail__status {
    color: var(--jh-color-content-positive-enabled, #1b7f4a);
  }

  .book-rail__btn.is-complete jh-icon-circle-checkmark-filled {
    --jh-icon-color-fill: var(--jh-color-content-positive-enabled, #1f7a3f);
  }

  .book-rail__filter {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 0.35rem;
    margin: 0 0 0.75rem;
    padding: 0.35rem 0.5rem 0.75rem;
    border-bottom: 1px solid var(--jh-color-divider-primary, #e7e7e7);
  }

  .book-rail__hidden {
    margin: 0.15rem 0 0;
    padding: 0 0.15rem;
    font-size: 0.75rem;
    line-height: 1.35;
    color: var(--jh-color-content-secondary-enabled, #5f5f5f);
  }

  .book-rail-select {
    display: none;
    box-sizing: border-box;
    width: 100%;
    margin: 0 0 0.75rem;
    padding: 0.55rem 0.65rem;
    border: 1px solid var(--jh-color-divider-primary, #e7e7e7);
    border-radius: var(--jh-border-radius-100, 4px);
    background: var(--jh-color-container-page, #fff);
    color: var(--jh-color-content-primary-enabled, #1a1a1a);
    font: inherit;
    font-size: 0.875rem;
  }

  .book-pane {
    position: relative;
    box-sizing: border-box;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 0;
  }

  .book-pane__toolbar {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
    padding: 0.85rem 1.5rem 0.65rem;
    border-bottom: 1px solid var(--jh-color-divider-primary, #e7e7e7);
    background: var(--jh-color-container-page, #fff);
  }

  .book-pane__search-meta {
    margin: 0;
    font-size: 0.8125rem;
    line-height: 1.4;
    color: var(--jh-color-content-secondary-enabled, #5f5f5f);
  }

  .book-pane__search-meta-list {
    display: inline;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .book-pane__search-meta-list li {
    display: inline;
  }

  .book-pane__search-meta-list li:not(:last-child)::after {
    content: ' · ';
  }

  .book-pane__search-jump {
    margin: 0;
    padding: 0;
    border: none;
    background: none;
    color: var(--jh-color-content-brand-enabled, #0a6ebd);
    font: inherit;
    font-size: inherit;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 0.12em;
  }

  .book-pane__search-jump:hover {
    color: var(--jh-color-content-brand-hover, #085a9e);
  }

  .book-pane__scroll {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    padding: 0.85rem 1.5rem 4.5rem;
  }

  .book-pane__content {
    box-sizing: border-box;
    width: 100%;
    max-width: 68.75rem; /* ~1100px */
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
    /* Room so the last categories can scroll flush under the sticky top. */
    padding-bottom: max(55vh, 16rem);
  }

  .book-category {
    scroll-margin-top: 0.25rem;
    padding-top: 1.5rem;
  }

  .book-category:first-child {
    padding-top: 0;
  }

  .book-category__heading {
    --book-sticky-canvas: var(--jh-color-container-page, #fff);
    position: sticky;
    top: 0;
    z-index: 3;
    box-sizing: border-box;
    margin: 0 0 0.65rem;
    padding: 0.65rem 0 0.55rem;
    font-size: 1.0625rem;
    font-weight: 700;
    line-height: 1.3;
    color: var(--jh-color-content-primary-enabled, #1a1a1a);
    background: var(--book-sticky-canvas);
    border-bottom: 2px solid var(--jh-color-divider-primary, #e7e7e7);
    transition: background-color 0.2s ease, box-shadow 0.2s ease;
  }

  /*
   * Opaque mask above the sticky title so previous fields can’t peek through
   * the category spacing while scrolling.
   */
  .book-category__heading::before {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 100%;
    height: 1.5rem;
    background: var(--book-sticky-canvas);
    pointer-events: none;
  }

  .book-category__heading.is-flash {
    background: var(--jh-color-container-brand-subtle-enabled, #e8f1f8);
    box-shadow: inset 0 -2px 0 var(--jh-color-content-brand-enabled, #0a6ebd);
    animation: book-cat-flash 1.1s ease-out;
  }

  .book-category__heading.is-flash::before {
    background: var(--book-sticky-canvas);
  }

  @keyframes book-cat-flash {
    0% {
      background: var(--jh-color-container-brand-subtle-hover, #dceaf5);
    }
    100% {
      background: var(--jh-color-container-page, #fff);
    }
  }

  .book-category__hidden {
    margin: 0.75rem 0 0;
    font-size: 0.8125rem;
    line-height: 1.4;
    color: var(--jh-color-content-secondary-enabled, #5f5f5f);
  }

  .book-fields {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    column-gap: 1.5rem;
    row-gap: 0.75rem;
    max-width: none;
    min-width: 0;
    align-items: start;
    justify-items: stretch;
  }

  .book-section__heading {
    grid-column: 1 / -1;
    box-sizing: border-box;
    margin: 0.35rem 0 0;
    padding: 0.55rem 0 0.35rem;
    font-size: 0.9375rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1.3;
    color: var(--jh-color-content-primary-enabled, #1a1a1a);
    border-bottom: 1px solid var(--jh-color-divider-primary, #e7e7e7);
  }

  .book-field__hint {
    margin: 0.25rem 0 0;
    font-size: 0.75rem;
    line-height: 1.3;
    color: var(--jh-color-content-secondary-enabled, #5f5f5f);
  }

  .book-date {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 0;
    min-width: 0;
  }

  .book-date__picker {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 0;
    border: none;
    background: transparent;
    color: var(--jh-color-content-brand-enabled, #0a6ebd);
    cursor: pointer;
    --jh-icon-color-fill: currentColor;
  }

  .book-date__native {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* Float over the scroll pane — opaque surface + mid elevation so field
     borders never cut through the control. */
  .book-back-top {
    position: absolute;
    right: 1.25rem;
    bottom: 1.25rem;
    z-index: 6;
    display: inline-flex;
    pointer-events: none;
  }

  .book-back-top jh-button {
    pointer-events: auto;
    box-shadow: var(--jh-shadow-mid, 0 4px 12px rgba(0, 0, 0, 0.18));
    --jh-button-color-background-secondary-enabled: var(
      --jh-color-container-page,
      #fff
    );
    --jh-button-color-background-secondary-hover: var(
      --jh-color-container-secondary-hover,
      #f4f5f6
    );
    --jh-button-color-background-secondary-focus: var(
      --jh-color-container-secondary-hover,
      #f4f5f6
    );
    --jh-button-color-background-secondary-active: var(
      --jh-color-container-secondary-active,
      #e8eaeb
    );
  }

  .book-empty {
    display: flex;
    flex: 1 1 auto;
    align-items: center;
    justify-content: center;
    min-height: 16rem;
    padding: 2rem 1rem 3rem;
    text-align: center;
  }

  .book-empty__inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    max-width: 22rem;
  }

  .book-empty__icon {
    display: grid;
    place-items: center;
    width: 2.5rem;
    height: 2.5rem;
    margin: 0 0 0.85rem;
    color: var(--jh-color-content-secondary-enabled, #5f5f5f);
    --jh-icon-color-fill: currentColor;
  }

  .book-empty__icon jh-icon-circle-checkmark,
  .book-empty__icon jh-icon-magnifying-glass {
    width: 2rem;
    height: 2rem;
  }

  .book-empty__title {
    margin: 0 0 0.5rem;
    font-size: 1.125rem;
    font-weight: 600;
    line-height: 1.3;
    color: var(--jh-color-content-primary-enabled, #1a1a1a);
  }

  .book-empty__copy {
    margin: 0 0 1.25rem;
    font-size: 0.875rem;
    line-height: 1.45;
    color: var(--jh-color-content-secondary-enabled, #5f5f5f);
  }

  .book-empty__actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.5rem;
  }

  .book-section__heading:first-child {
    margin-top: 0;
  }

  .book-field {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    min-width: 0;
    width: 100%;
    box-sizing: border-box;
    border-radius: var(--jh-border-radius-100, 4px);
    transition: background-color 0.2s ease, box-shadow 0.2s ease;
  }

  .book-field.is-target {
    background: var(--jh-color-container-brand-subtle-enabled, #e8f1f8);
    box-shadow: inset 0 0 0 2px var(--jh-color-content-brand-enabled, #0a6ebd);
    padding: 0.35rem 0.45rem;
    margin: -0.35rem -0.45rem;
    animation: book-field-target 1.2s ease-out;
  }

  @keyframes book-field-target {
    0% {
      background: var(--jh-color-container-brand-subtle-hover, #dceaf5);
    }
    100% {
      background: transparent;
      box-shadow: inset 0 0 0 2px transparent;
    }
  }

  /* One column by default — same cell width for Yes/No and multi-option selects. */
  .book-field--cell {
    grid-column: auto;
  }

  /* Genuinely wide controls only. */
  .book-field--span {
    grid-column: 1 / -1;
  }

  .book-field__label-row {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.35rem 0.5rem;
    min-width: 0;
  }

  .book-field__label {
    margin: 0;
    font-size: 0.875rem;
    font-weight: 600;
    line-height: 1.3;
    color: var(--jh-color-content-primary-enabled, #1a1a1a);
  }

  .book-field__required {
    color: var(--jh-color-content-negative-enabled, #b42318);
    font-weight: 600;
  }

  .book-field__helper {
    margin: 0;
    font-size: 0.8125rem;
    line-height: 1.35;
    color: var(--jh-color-content-secondary-enabled, #5f5f5f);
  }

  .book-field__tags {
    display: inline-flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.35rem;
    min-width: 0;
  }

  .book-confirm {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 1rem;
    padding: 1.25rem 1.5rem 1.5rem;
    text-align: left;
  }

  .book-confirm__status {
    box-sizing: border-box;
    width: 100%;
    max-width: 100%;
    min-width: 0;
  }

  .book-confirm__details {
    width: 100%;
    text-align: left;
    --jh-card-color-background: var(--jh-color-container-page, #fff);
  }

  .book-confirm__dl {
    margin: 0;
    display: grid;
    grid-template-columns: minmax(8.5rem, 40%) minmax(0, 1fr);
    gap: 0.55rem 1rem;
    font-size: 0.875rem;
  }

  .book-confirm__dl dt {
    margin: 0;
    color: var(--jh-color-content-secondary-enabled, #5f5f5f);
    font-weight: 500;
  }

  .book-confirm__dl dd {
    margin: 0;
    font-weight: 600;
    color: var(--jh-color-content-primary-enabled, #1a1a1a);
    word-break: break-word;
  }

  .book-confirm__summary {
    margin: 0;
    font-size: 0.8125rem;
    line-height: 1.45;
    color: var(--jh-color-content-secondary-enabled, #5f5f5f);
  }

  .book-confirm__actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
    gap: 0.65rem;
  }

  .book-error-list {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }

  .book-error-list__item {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.35rem;
  }

  .book-error-list__item jh-divider {
    width: 100%;
    margin: 0.35rem 0 0.5rem;
  }

  .book-error-list__reason {
    margin: 0;
    font-size: 0.875rem;
    line-height: 1.45;
    color: var(--jh-color-content-primary-enabled, #1a1a1a);
  }

  /* Tone via JH tag tokens (same pattern as application overview). */
  .book-field__tag--brand {
    --jh-tag-color-background-enabled: var(--jh-color-container-brand-subtle-enabled, #e8f1fa);
    --jh-tag-color-text-enabled: var(--jh-color-content-brand-enabled, #0a6ebd);
    --jh-tag-color-border-enabled: transparent;
  }

  .book-field__tag--warning {
    --jh-tag-color-background-enabled: var(--jh-color-container-warning-enabled, #fdf3e2);
    --jh-tag-color-text-enabled: var(--jh-color-content-warning-enabled, #9a6700);
    --jh-tag-color-border-enabled: transparent;
  }

  .book-affix {
    color: var(--jh-color-content-secondary-enabled, #5f5f5f);
    font-size: 0.875rem;
    font-weight: 600;
    padding: 0 0.15rem;
  }

  .book-naics {
    position: relative;
    min-width: 0;
  }

  .book-naics__list {
    position: absolute;
    z-index: 5;
    top: calc(100% + 0.2rem);
    left: 0;
    right: 0;
    margin: 0;
    padding: 0.25rem 0;
    list-style: none;
    max-height: 12rem;
    overflow: auto;
    border-radius: var(--jh-border-radius-100, 4px);
    border: 1px solid var(--jh-color-divider-primary, #e7e7e7);
    background: var(--jh-color-container-page, #fff);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
  }

  .book-naics__option {
    display: block;
    width: 100%;
    margin: 0;
    padding: 0.55rem 0.75rem;
    border: 0;
    background: transparent;
    color: var(--jh-color-content-primary-enabled, #1a1a1a);
    font: inherit;
    font-size: 0.875rem;
    text-align: left;
    cursor: pointer;
  }

  .book-naics__option:hover,
  .book-naics__option:focus-visible {
    background: var(--jh-color-container-secondary-enabled, #f4f5f6);
    outline: none;
  }

  .book-naics__empty {
    margin: 0;
    padding: 0.65rem 0.75rem;
    font-size: 0.8125rem;
    color: var(--jh-color-content-secondary-enabled, #5f5f5f);
  }

  .book-config-loading {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    padding: 2rem 1.5rem;
    text-align: center;
  }

  .book-config-loading jh-progress {
    width: min(16rem, 100%);
  }

  .book-config-loading__sub {
    margin: 0;
    max-width: 22rem;
    font-size: 0.875rem;
    line-height: 1.45;
    color: var(--jh-color-content-secondary-enabled, #5f5f5f);
  }

  .book-field jh-input,
  .book-field jh-input-textarea,
  .book-field jh-select,
  .book-field jh-switch {
    width: 100%;
  }

  .book-foot {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
    gap: 0.75rem;
    padding: 0.85rem 1.5rem 1.15rem;
    border-top: 1px solid var(--jh-color-divider-primary, #e7e7e7);
    background: var(--jh-color-container-page, #fff);
  }

  .book-status {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @media not all {
    .book-backdrop {
      background: var(--jh-color-container-page, #151719);
    }

    .book-backdrop--result {
      background: rgba(0, 0, 0, 0.72);
    }

    .book-modal {
      background: var(--jh-color-container-page, #151719);
    }

    .book-rail {
      background: var(--jh-color-container-secondary-enabled, #2a2d33);
    }

    .book-rail__btn:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .book-rail__btn.is-active {
      background: var(--jh-color-container-brand-subtle-enabled, rgba(10, 110, 189, 0.22));
      color: var(--jh-color-content-brand-enabled, #5ba3e0);
      box-shadow: inset 3px 0 0 var(--jh-color-content-brand-enabled, #5ba3e0);
    }

    .book-rail__btn.is-active:hover {
      background: var(--jh-color-container-brand-subtle-hover, rgba(10, 110, 189, 0.3));
    }

    .book-foot {
      background: var(--jh-color-container-page, #151719);
    }

    .book-pane__toolbar,
    .book-category__heading,
    .book-section__heading,
    .book-step-chrome {
      background: var(--jh-color-container-page, #151719);
    }

    .book-category__heading {
      --book-sticky-canvas: var(--jh-color-container-page, #151719);
    }

    .book-category__heading.is-flash {
      background: var(--jh-color-container-brand-subtle-enabled, rgba(10, 110, 189, 0.22));
    }

    .book-field.is-target {
      background: var(--jh-color-container-brand-subtle-enabled, rgba(10, 110, 189, 0.22));
    }

    .book-error-summary jh-notification {
      --jh-notification-color-background-neutral: var(
        --jh-color-container-negative-subtle-enabled,
        rgba(180, 35, 24, 0.18)
      );
      --jh-notification-color-text-neutral: var(--jh-color-content-primary-enabled, #f5f5f5);
      border-color: var(--jh-color-border-negative-enabled, rgba(243, 180, 174, 0.45));
    }

    .book-step-back {
      color: var(--jh-color-content-brand-enabled, #5ba3e0);
    }

    .book-field__label {
      color: var(--jh-color-content-primary-enabled, #f5f5f5);
    }

    .book-back-top jh-button {
      --jh-button-color-background-secondary-enabled: var(
        --jh-color-container-page,
        #151719
      );
      --jh-button-color-background-secondary-hover: var(
        --jh-color-container-secondary-hover,
        #2a2d33
      );
      --jh-button-color-background-secondary-focus: var(
        --jh-color-container-secondary-hover,
        #2a2d33
      );
      --jh-button-color-background-secondary-active: var(
        --jh-color-container-secondary-active,
        #353940
      );
      box-shadow: var(--jh-shadow-mid, 0 4px 16px rgba(0, 0, 0, 0.45));
    }

    .book-empty__title {
      color: var(--jh-color-content-primary-enabled, #f5f5f5);
    }

    .book-empty__copy,
    .book-empty__icon {
      color: var(--jh-color-content-secondary-enabled, #a8a8a8);
    }

    .book-naics__list {
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }
  }

  @media (max-width: 720px) {
    .book-backdrop--result {
      padding: 48px 0.5rem;
    }

    .book-body {
      padding: 0.85rem 0.75rem 0;
    }

    .book-main {
      grid-template-columns: 1fr;
      grid-template-rows: auto minmax(0, 1fr);
      margin: 0 -0.75rem;
    }

    .book-rail {
      border-right: none;
      border-bottom: 1px solid var(--jh-color-divider-primary, #e7e7e7);
      overflow: visible;
      padding: 0.75rem 0.75rem 0.85rem;
    }

    .book-rail__filter {
      margin-bottom: 0.5rem;
      padding-bottom: 0.5rem;
    }

    .book-rail-select {
      display: block;
    }

    .book-rail__list {
      display: none;
    }

    .book-fields {
      max-width: none;
      grid-template-columns: minmax(0, 1fr);
    }
  }
